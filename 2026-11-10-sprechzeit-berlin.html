<style>
/* Layout: a transit map for your day — time slots are "lines" (2 / 5 / 15 / 30 min) like Berlin route badges; today is a single column of stops; signage yellow is the accent */
:root{
  --bg:#eceef1; --surface:#ffffff; --sunk:#e1e4ea; --ink:#11141b; --muted:#59606f; --line:#d3d7df;
  --sign:#f3c400; --sign-ink:#11141b; --sign-soft:#fff3c2;
  --l2:#1f8a5b; --l5:#1d5fc4; --l15:#c2382f; --l30:#6f3fa0;
  --ok:#1f8a5b; --ok-soft:#d8f0e4; --bad:#c2382f; --bad-soft:#f7dcd9;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a22; --sunk:#20242f; --ink:#eceef3; --muted:#a0a7b6; --line:#2c313e;
  --sign:#ffd21f; --sign-ink:#11141b; --sign-soft:#3a3214;
  --l2:#3fbf86; --l5:#5b93ef; --l15:#ef6a5f; --l30:#a77ad8;
  --ok:#3fbf86; --ok-soft:#163327; --bad:#ef6a5f; --bad-soft:#3e1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --sunk:#20242f; --ink:#eceef3; --muted:#a0a7b6; --line:#2c313e;
  --sign:#ffd21f; --sign-ink:#11141b; --sign-soft:#3a3214;
  --l2:#3fbf86; --l5:#5b93ef; --l15:#ef6a5f; --l30:#a77ad8;
  --ok:#3fbf86; --ok-soft:#163327; --bad:#ef6a5f; --bad-soft:#3e1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-weight:900;font-stretch:115%;font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:-.01em}
h2{font-weight:900;font-stretch:105%;font-size:1.45rem}
h3{font-weight:700;font-size:1.12rem}
p{margin:0}
a{color:var(--l5)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.9rem} .en{color:var(--muted);font-size:.85rem;font-style:italic}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:16px}
.stack>*,.card>*{min-width:0}

header.top{padding-block:20px 10px;display:grid;gap:4px}
.sign{display:inline-flex;align-items:center;gap:8px;background:var(--sign);color:var(--sign-ink);font-family:var(--f-display);font-weight:900;font-stretch:110%;padding:4px 10px;border-radius:6px;font-size:.95rem;justify-self:start}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:700}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.card.sunk{background:var(--sunk);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sign{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.say{border:0;background:var(--sunk);border-radius:99px;width:34px;height:34px;cursor:pointer;flex:none;display:inline-grid;place-items:center}
input[type=text],input[type=number],textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:130px;line-height:1.5}

/* today hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px;flex:none}
.ring text{font-family:var(--f-display);font-weight:900}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.why{border-left:4px solid var(--sign);padding:6px 12px;font-style:italic}

/* lines */
.lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;min-height:76px}
.line:hover{border-color:var(--lc)}
.badge{width:46px;height:46px;border-radius:8px;background:var(--lc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.15rem;flex:none}
.line b{display:block;font-family:var(--f-display);font-weight:700}
.line span.small{color:var(--muted)}
@media (max-width:540px){.lines{grid-template-columns:1fr}.line{min-height:64px}}

.baustein{border-top:5px solid var(--sign)}
.baustein .ex{display:flex;gap:8px;align-items:flex-start}
.mission .lvl{font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--sunk);text-transform:uppercase;letter-spacing:.06em}
.plan li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);list-style:none}
.plan li:first-child{border-top:0}
.plan input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);margin-top:2px;flex:none}
.plan ul{margin:0;padding:0}

/* session */
.session{border:2px solid var(--lc);border-radius:var(--r);background:var(--surface);padding:18px;display:grid;gap:14px}
.session .head{display:flex;gap:12px;align-items:center}
.clock{font-family:var(--f-mono);font-weight:600;font-size:1.2rem;margin-left:auto;font-variant-numeric:tabular-nums}
.verdict{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:900;font-size:1.3rem}
.lv{padding:2px 10px;border-radius:6px;color:#fff}
.lv.B1{background:var(--l15)} .lv.B1p{background:#c98a00} .lv.B2{background:var(--l2)}
.res table{border-collapse:collapse;width:100%;font-size:.95rem}
.res td,.res th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.res th{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.wrong{color:var(--bad)} .right{color:var(--ok);font-weight:700}
.b2text{border-left:4px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 10px 10px 0;white-space:pre-line}
.keep{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--sunk);border-radius:10px}
.keep input{width:20px;height:20px;accent-color:var(--ok);margin-top:3px;flex:none}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.char{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px}
.char:hover{border-color:var(--l15)}
.chat{display:grid;gap:10px;max-height:55vh;overflow-y:auto}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--sunk)}
.msg.ai{justify-self:start;background:var(--sign-soft)}
.msg table{border-collapse:collapse;width:100%;font-size:.9rem}
.msg td,.msg th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.msg p+p,.msg p+ul{margin-top:6px} .msg ul{margin:4px 0;padding-left:18px}

/* bank & proof */
.bank .item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.bank .item:first-child{border-top:0}
.bank .item p{flex:1;min-width:0}
.topic{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.week .col{display:grid;gap:4px;justify-items:center;align-self:stretch;grid-template-rows:1fr auto auto}
.week .bar{width:100%;max-width:34px;background:var(--l5);border-radius:6px 6px 2px 2px;align-self:end;min-height:3px}
.week .bar.goal{background:var(--l2)}
.week .d{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.week .v{font-family:var(--f-mono);font-size:.72rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots .lv{font-family:var(--f-mono);font-size:.75rem;font-weight:600;padding:2px 8px}
.wins li{padding:8px 0;border-top:1px solid var(--line);list-style:none;display:grid;gap:2px}
.wins ul{margin:0;padding:0}
.wins li:first-child{border-top:0}
.callout{border-radius:var(--r);padding:12px 14px;background:var(--sign-soft);border:1px solid var(--sign)}
.callout.bad{background:var(--bad-soft);border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;font-weight:700;max-width:calc(100% - 32px);text-align:center}
footer{margin-top:30px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const BAUSTEINE=[
 ["obwohl / trotzdem","Contrast: obwohl starts a side clause (verb at the end). trotzdem starts a main clause (verb next).",["Ich lerne jeden Tag, obwohl ich wenig Zeit habe.","Die U-Bahn war voll. Trotzdem habe ich zehn Minuten gehört."]],
 ["Konjunktiv II: wenn … würde / hätte / wäre","Wishes, advice, unreal situations. In the wenn-clause the verb goes to the end; the main clause starts with the verb.",["Wenn ich mehr Zeit hätte, würde ich jeden Abend Klarinette üben.","An deiner Stelle würde ich die Prüfung jetzt anmelden."]],
 ["Passiv","werden + Partizip II: the action is important, not the person. Past: wurde + Partizip II.",["Der Fehler wurde gestern vom Entwickler behoben.","In Berlin wird viel gebaut."]],
 ["Relativsatz mit Präposition","Preposition + der/die/das in the right case. Verb at the end.",["Die Stadt, in der ich seit drei Jahren wohne, ist laut, aber spannend.","Das ist die Kollegin, mit der ich jeden Tag teste."]],
 ["je … desto","The more … the more. After je: verb at the end. After desto: comparative, then verb.",["Je mehr ich spreche, desto weniger Angst habe ich.","Je früher ich aufstehe, desto ruhiger ist die Bahn."]],
 ["zwar … aber","Yes, … but … – perfect for balanced opinions in the exam.",["Berlin ist zwar teuer, aber es gibt hier so viele Möglichkeiten.","Ich verstehe zwar fast alles, aber beim Sprechen fehlen mir manchmal Wörter."]],
 ["Nomen-Verb-Verbindungen","Fixed noun + verb pairs make you sound B2: eine Entscheidung treffen, in Frage kommen, zur Verfügung stehen, Verantwortung übernehmen.",["Ich habe die Entscheidung getroffen, die B2-Prüfung zu machen.","Ein Umzug kommt für mich gerade nicht in Frage."]],
 ["Verb + Präposition + da(r)-","sich freuen auf, sich kümmern um, sich ärgern über … With a clause: darauf, dass … / darüber, dass …",["Ich freue mich darauf, endlich fließend Deutsch zu sprechen.","Ich ärgere mich darüber, dass ich so oft ins Englische wechsle."]],
 ["um … zu / damit","Purpose. Same subject → um … zu. Different subject → damit.",["Ich höre Podcasts, um mein Hörverstehen zu verbessern.","Ich spreche langsam, damit mich alle verstehen."]],
 ["Konjunktiv II Vergangenheit","Regret / unreal past: hätte / wäre + Partizip II. With modal: hätte … machen sollen.",["Ich hätte den B2-Kurs damals zu Ende machen sollen.","Wenn ich früher angefangen hätte, wäre ich schon fertig."]],
 ["Indirekte Frage","ob / wann / warum … + verb at the end. Polite and very B2.",["Ich frage mich oft, ob mein Deutsch schon gut genug ist.","Könnten Sie mir sagen, wann der nächste Termin frei ist?"]],
 ["nicht nur … sondern auch","Not only … but also – adds weight to your arguments.",["Deutsch hilft mir nicht nur im Job, sondern auch beim Arzt.","Berlin ist nicht nur groß, sondern auch sehr international."]],
 ["Partizip als Adjektiv","Partizip I/II before a noun: die steigenden Mieten, der behobene Fehler.",["Die steigenden Mieten sind in Berlin ein großes Thema.","Den gestern gefundenen Fehler habe ich sofort gemeldet."]],
 ["Futur I für Vermutungen","werden + Infinitiv (+ wohl / bestimmt) to guess about now or the future.",["Die Bahn wird wohl wieder Verspätung haben.","Bis zum Sommer werde ich bestimmt viel sicherer sprechen."]]
];

 {id:"spaeti",name:"Murat",role:"Späti in Neukölln",sie:false,desc:"Freundlich, neugierig, redet gern über alles – Wetter, BVG, Fußball, dein Leben.",prompt:"You are Murat, 45, who runs a Spätkauf in Berlin-Neukölln. Warm, chatty, a bit cheeky, uses everyday Berlin German (occasionally 'na', 'ick' is fine but keep it understandable). You use du. Ask about the learner's day, work and life."},

const LS="sprechzeit-v1",DAY=864e5;

  if(dbRef){clearTimeout(saveT);saveT=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(S))).then(()=>setSync("Gespeichert in deinem Claude-Konto")).catch(()=>setSync("Nur in diesem Browser gespeichert"))},800)}}

function streak(){let s=0,d=new Date(),joker=null;if(!active(ymd(d)))d=new Date(d.getTime()-DAY);
  for(let i=0;i<400;i++){const k=ymd(d);if(active(k))s++;else if(joker===null||dayNum(joker)-dayNum(d)>=7){joker=d}else break;d=new Date(d.getTime()-DAY)}return s}

function md(src){const L=String(src).split("\n");let h="",i=0;while(i<L.length){const l=L[i];
  if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){if(!/^\s*\|[\s:|-]+\|?\s*$/.test(L[i]))rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|"));i++}h+=`<div class="tablewrap"><table>${rows.map((r,j)=>`<tr>${r.map(c=>j===0?`<th>${inline(c.trim())}</th>`:`<td>${inline(c.trim())}</td>`).join("")}</tr>`).join("")}</table></div>`;continue}
  if(/^\s*[-*•]\s+/.test(l)){h+="<ul>";while(i<L.length&&/^\s*[-*•]\s+/.test(L[i])){h+=`<li>${inline(L[i].replace(/^\s*[-*•]\s+/,""))}</li>`;i++}h+="</ul>";continue}
  if(/^#{1,4}\s/.test(l)){h+=`<p><b>${inline(l.replace(/^#+\s/,""))}</b></p>`;i++;continue}
  if(l.trim())h+=`<p>${inline(l)}</p>`;i++}return h}
const synth=window.speechSynthesis;let deVoice=null;

  const turns=[{role:"user",content:charRules(c)+"\n\nStart the conversation now with a natural opening line, in character."},...msgs.slice(-24)];
  if(turns.length>1&&turns[1].role==="user")turns.splice(1,0,{role:"assistant",content:"Hallo!"});
  try{const r=await sampleFn(turns,{signal:chatCtl.signal,cache:false,onText:({text:x})=>{b.innerHTML=md(x);box.scrollTop=box.scrollHeight}});msgs.push({role:"assistant",content:r.text})}
  catch(e){if(e?.text)msgs.push({role:"assistant",content:e.text});else if(text)msgs.pop();toast(aiErr(e))}
  if(SES&&SES.line===15)render()}
/* Line 30 */
function s30(){const L=SES.data.letter,r=SES.data.res;
  return `<div class="card sunk"><span class="topic">telc · ${esc(L[0])}</span><p>${esc(L[1])}</p><ol style="margin:0;padding-left:22px">${L[2].map(x=>`<li>${esc(x)}</li>`).join("")}</ol><span class="small muted">Mindestens 3 Leitpunkte · ca. 150 Wörter · Sie-Form · 30 Minuten</span></div>
   <textarea id="s30in" style="min-height:300px" placeholder="Betreff …&#10;&#10;Sehr geehrte Damen und Herren,">${esc(SES.data.text||"")}</textarea><span class="small muted" id="s30wc">${wc(SES.data.text||"")} Wörter</span>
   <div class="row"><button class="btn go" data-act="s30check">Von der KI bewerten lassen</button>${sampleFn?"":`<button class="btn ghost sm" data-act="s30copy">Prompt kopieren</button>`}</div>
   <div class="res" id="s30out">${r?md(r):""}</div>
   <p class="small muted">Mehr Briefe, Modelltests und Musterlösungen: dein telc-B2-Trainer.</p>`}
function s30Prompt(text){const L=SES.data.letter;return `You are a strict but fair telc Deutsch B2 examiner (Schriftlicher Ausdruck). ${LEARNER}
Task (${L[0]}): ${L[1]} Leitpunkte: ${L[2].join("; ")}. Rules: semi-formal letter, Sie-form, at least 3 of 4 guiding points, about 150 words.
Answer briefly:
1. **Leitpunkte**: ✅/⚠️/❌ per point, one line each.
2. Table | ❌ Fehler | ✅ richtig | 💡 warum | max 6 rows, warum = 1 short line simple English.
3. **Bewertung**: I Aufgabenbewältigung, II Kommunikative Gestaltung, III Formale Richtigkeit – each A/B/C/D (A=5,B=3,C=1,D=0), total = sum × 3 of 45, and one honest sentence.
4. **So klingt es auf B2:** the letter improved, keeping their ideas.
LETTER:
"""${text}"""`}
async function s30check(){const text=$("s30in").value.trim();if(wc(text)<40){toast("Schreib erst mehr – mindestens 40 Wörter.");return}SES.data.text=text;
  if(!sampleFn){noAI(s30Prompt(text));return}
  const o=$("s30out");o.innerHTML=`<p class="muted">Der Prüfer liest …</p>`;
  try{const r=await sampleFn(s30Prompt(text),{cache:false,onText:({text:x})=>{o.innerHTML=md(x)}});SES.data.res=r.text}catch(e){o.innerHTML=e?.text?md(e.text):`<p class="callout">${esc(aiErr(e))}</p>`}}

/* ================= VIEWS ================= */
let view="heute",missionNote=false;
function ring(min,goal){const p=Math.min(1,min/goal),r=46,c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 108 108" role="img" aria-label="${Math.round(min)} von ${goal} Minuten"><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle cx="54" cy="54" r="${r}" fill="none" stroke="${p>=1?"var(--l2)":"var(--sign)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 54 54)"/><text x="54" y="54" text-anchor="middle" font-size="26" fill="var(--ink)">${Math.round(min)}</text><text x="54" y="74" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">/ ${goal} MIN</text></svg>`}
function vHeute(){
  const d=today(),B=baustein(),M=mission(),st=streak();
  const y=ymd(new Date(Date.now()-DAY)),missedY=!active(y)&&Object.keys(S.days).some(k=>k<y&&active(k))&&!active(ymd());
  const totalDays=Object.keys(S.days).filter(active).length;
  let h=`<div class="stack">`;
  if(!S.setup)h+=`<div class="callout"><b>Willkommen.</b> Drei Dinge machen diese App zu deiner: dein Warum, dein Tagesziel und deine festen Lernmomente. <a href="#plan">Jetzt einrichten →</a> <span class="en">(1 minute)</span></div>`;
  if(missedY)h+=`<div class="callout bad"><b>Gestern war Pause – heute nicht zweimal verpassen.</b><br><span class="small">Keine Zeit? Linie 2 dauert zwei Minuten. Das zählt.</span></div>`;
  h+=`<div class="card"><div class="hero">${ring(d.min,S.goal)}<div class="stack" style="gap:10px"><div class="stats"><div class="stat"><b>${st}</b><span class="small muted">Tage in Folge</span></div><div class="stat"><b>${totalDays}</b><span class="small muted">Lerntage</span></div><div class="stat"><b>${S.bank.length}</b><span class="small muted">B2-Sätze</span></div></div><p class="why">${esc(S.why)}</p></div></div></div>`;
  if(SES)h+=sessionHtml();
  else h+=`<div class="stack" style="gap:8px"><h2>Wie viel Zeit hast du gerade?</h2><p class="en">Pick a line. Even 2 minutes keep your streak alive.</p>
   <div class="lines">${[2,5,15,30].map(n=>`<button class="line" data-line="${n}" style="--lc:${LINES[n].c}"><span class="badge">${n}</span><span><b>${LINES[n].name}</b><span class="small">${LINES[n].d}</span></span></button>`).join("")}</div></div>`;
  h+=`<div class="card baustein"><span class="label">B2-Baustein des Tages</span><h3>${esc(B[0])}</h3><p class="small">${esc(B[1])}</p>${B[2].map(x=>`<div class="ex">${sayBtn(x)}<span>${esc(x)}</span></div>`).join("")}</div>`;
  const md2=d.mission;
  h+=`<div class="card mission"><div class="row between"><span class="label">Berlin-Mission des Tages</span><span class="lvl">${esc(M[0])}</span></div><h3>${esc(M[1])}</h3>
   ${md2?`<p class="right">✓ Erledigt. Steht jetzt auf deiner Beweis-Wand.</p>`:missionNote?`<label class="label" for="mNote">Was ist passiert? Was hast du gesagt?</label><textarea id="mNote" style="min-height:80px" placeholder="z. B. Ich habe beim Bäcker gefragt, … Sie hat geantwortet, …"></textarea><div class="row"><button class="btn go" data-act="mSave">Auf die Beweis-Wand</button><button class="btn ghost sm" data-act="mCancel">Abbrechen</button></div>`:`<div class="row"><button class="btn sign" data-act="mDone">Geschafft!</button><button class="btn ghost sm" data-act="mOther">Andere Mission</button></div><p class="en">Real life is your best classroom. Small and awkward counts.</p>`}</div>`;
  h+=`<div class="card plan"><span class="label">Dein Tagesplan</span><ul>${S.anchors.map((a,i)=>`<li><input type="checkbox" id="an-${i}" data-anch="${i}" ${d.anch.includes(i)?"checked":""}><label for="an-${i}"><b>${esc(a.when)}</b> → ${esc(a.what)} <span class="small muted">· ${a.min} Min.</span></label></li>`).join("")}</ul><p class="small muted">Abhaken trägt die Minuten ein. <a href="#plan">Plan ändern</a></p></div>`;
  h+=`<div class="card"><span class="label">Außerhalb der App gelernt?</span><p class="small">Kurs, Podcast, Gespräch, Serie – trag es ein. Alles zählt.</p><div class="row">${[5,10,20,45].map(n=>`<button class="btn sm" data-addmin="${n}">+${n} Min.</button>`).join("")}</div><p class="small muted">Zum Hören: ${LISTEN.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" · ")}</p></div>`;
  return h+`</div>`;
}
function vBank(){
  const by={};S.bank.forEach((b,i)=>{(by[b.topic]||(by[b.topic]=[])).push([b,i])});
  return `<div class="stack"><div><h2>Mein Leben auf B2</h2><p class="muted" style="margin-top:6px">Deine eigenen Sätze über dein eigenes Leben – auf B2-Niveau. Das ist dein Material für die Prüfung (Teil 1: über eine Erfahrung sprechen) und für jedes echte Gespräch. <span class="en">Read them aloud often. They become yours.</span></p></div>
   ${S.bank.length?`<div class="row"><button class="btn go" data-act="readAll">🔊 Alle vorlesen (Shadowing)</button><button class="btn ghost sm" data-act="copyBank">Alle kopieren</button></div>`:""}
   ${S.bank.length?TOPICS.concat(Object.keys(by).filter(k=>!TOPICS.includes(k))).filter(t=>by[t]).map(t=>`<div class="card bank"><span class="label">${esc(t)} · ${by[t].length}</span>${by[t].map(([b,i])=>`<div class="item">${sayBtn(b.de)}<p>${esc(b.de)}<br><span class="small muted">${esc(b.d)}</span></p><button class="btn ghost sm" data-del="${i}" aria-label="Löschen">✕</button></div>`).join("")}</div>`).join(""):`<div class="card sunk"><b>Noch leer.</b><p class="small">Fahr heute Linie 2 oder 5. Die besten Sätze aus deinen Antworten landen hier – und werden dein persönliches B2.</p><a class="btn go" href="#heute" style="justify-self:start">Zu Heute</a></div>`}</div>`;
}
function vBeweise(){
  const days=[];for(let i=6;i>=0;i--){const dt=new Date(Date.now()-i*DAY);const k=ymd(dt);days.push([dt,(S.days[k]||{}).min||0])}
  const max=Math.max(S.goal,...days.map(x=>x[1]));const wk=days.reduce((a,x)=>a+x[1],0);
  const last=S.levels.slice(-10),b2=last.filter(x=>x.l==="B2").length;
  const total=Object.values(S.days).reduce((a,d)=>a+(d.min||0),0);
  return `<div class="stack"><div><h2>Beweise</h2><p class="muted" style="margin-top:6px">Motivation kommt von Beweisen, nicht von Hoffnung. <span class="en">Proof that you are getting there.</span></p></div>
   <div class="card"><div class="row between"><span class="label">Diese Woche</span><b>${Math.round(wk)} Min.</b></div>
    <div class="week">${days.map(([dt,m])=>`<div class="col"><div class="bar ${m>=S.goal?"goal":""}" style="height:${Math.max(3,m/max*90)}px"></div><span class="v">${Math.round(m)}</span><span class="d">${dt.toLocaleDateString("de-DE",{weekday:"short"})}</span></div>`).join("")}</div>
    <p class="small muted">Insgesamt ${Math.round(total)} Minuten ≈ ${(total/60).toFixed(1).replace(".",",")} Stunden Deutsch.</p></div>
   <div class="card"><span class="label">Wie oft klingst du schon wie B2?</span>${last.length?`<div class="row"><b style="font-family:var(--f-display);font-size:2rem">${b2} / ${last.length}</b><span class="small muted">deiner letzten Antworten (Linie 5) wurden als B2 bewertet.</span></div><div class="dots">${last.map(x=>`<span class="lv ${LVL[x.l]}">${esc(x.l)}</span>`).join("")}</div><p class="small muted">Ehrliche KI-Bewertung. Ziel: 8 von 10 – dann bist du bereit für die Prüfung.</p>`:`<p class="small">Noch keine Bewertung. Fahr Linie 5 – danach siehst du hier, wie oft du schon wie B2 klingst.</p>`}</div>
   <div class="card wins"><span class="label">Beweis-Wand · echte Momente auf Deutsch</span>${S.wins.length?`<ul>${S.wins.slice().reverse().map(w=>`<li><b>${esc(w.m)}</b><span>${esc(w.t)}</span><span class="small muted">${esc(w.d)}</span></li>`).join("")}</ul>`:`<p class="small">Hier landen deine erledigten Berlin-Missionen. Jeder Eintrag ist ein Moment, in dem du dich getraut hast.</p>`}</div></div>`;
}
function vPlan(){
  return `<div class="stack"><div><h2>Mein Plan</h2><p class="muted" style="margin-top:6px">Motivation hält nicht. Feste Momente halten. <span class="en">Tie German to things you already do every day.</span></p></div>
   <div class="card"><label class="label" for="why">Mein Warum</label><textarea id="why" style="min-height:80px">${esc(S.why)}</textarea><span class="small muted">Wird jeden Tag oben angezeigt. Schreib es auf Deutsch – ehrlich.</span></div>
   <div class="card"><label class="label" for="goal">Tagesziel in Minuten</label><div class="row"><input type="number" id="goal" min="5" max="240" step="5" value="${S.goal}" style="width:110px"><span class="small muted">Realistisch neben Arbeit: 30–60. Lieber jeden Tag 30 als einmal 3 Stunden.</span></div></div>
   <div class="card"><span class="label">Meine festen Lernmomente (Wenn … dann …)</span>${S.anchors.map((a,i)=>`<div class="stack" style="gap:6px;padding:10px 0;border-top:${i?"1px solid var(--line)":"0"}"><input type="text" data-anc="${i}" data-f="when" value="${esc(a.when)}" aria-label="Wann"><input type="text" data-anc="${i}" data-f="what" value="${esc(a.what)}" aria-label="Was"><div class="row"><input type="number" data-anc="${i}" data-f="min" value="${a.min}" min="1" max="120" style="width:90px" aria-label="Minuten"><span class="small muted">Minuten</span></div></div>`).join("")}</div>
   <button class="btn go" data-act="planSave" style="justify-self:start">Plan speichern</button>
   <div class="card sunk"><b>Warum das funktioniert</b><ul class="small" style="margin:0;padding-left:20px;display:grid;gap:4px"><li><b>Wenn-dann-Pläne</b> (fester Ort, feste Zeit) machen Lernen automatisch – du musst nicht jedes Mal neu entscheiden.</li><li><b>Produzieren statt konsumieren:</b> B2 entsteht beim Sprechen und Schreiben, nicht beim Lesen von Regeln.</li><li><b>Echo (aus dem Gedächtnis wiederholen)</b> verwandelt eine schöne B2-Version in deine eigene Sprache.</li><li><b>Dein eigenes Leben als Thema:</b> Sätze über dich behältst du – und brauchst sie wirklich.</li><li><b>Ein Joker pro Woche:</b> Ein verpasster Tag beendet deine Serie nicht. Zwei schon.</li></ul></div>
   <div class="card"><span class="label">Daten</span><div class="row"><button class="btn sm" data-act="export">Daten kopieren</button><button class="btn ghost sm" data-act="resetAsk">Alles zurücksetzen</button><span id="resetC" hidden class="row small"><b>Wirklich alles löschen?</b><button class="btn sm" data-act="resetYes">Ja</button><button class="btn ghost sm" data-act="resetNo">Nein</button></span></div></div></div>`;
}
function render(){
  document.querySelectorAll("nav.tabs a").forEach(a=>a.getAttribute("href")==="#"+view?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  app.innerHTML=({heute:vHeute,"mein-b2":vBank,beweise:vBeweise,plan:vPlan})[view]();
  const c=$("chat");if(c)c.scrollTop=c.scrollHeight;
  if(SES)tickClock();
}
function route(){const h=location.hash.slice(1);view=["heute","mein-b2","beweise","plan"].includes(h)?h:"heute";if(synth)synth.cancel();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el||el.disabled)return;const d=el.dataset;
  if(d.say!==undefined){speak(d.say);return}
  if(d.line){startSession(Number(d.line));return}
  if(d.char){SES.data.char=CHARACTERS.find(c=>c.id===d.char);SES.data.msgs=[];render();chatSend("");return}
  if(d.addmin){addMinutes(Number(d.addmin),"extra");toast(celebrate(Number(d.addmin)));render();return}
  if(d.del!==undefined){S.bank.splice(Number(d.del),1);save();render();return}
  switch(d.act){
    case "cancel":endSession(false);break;
    case "finish":endSession(true);break;
    case "s2check":s2check();break;
    case "s2copy":noAI(s2Prompt($("s2in").value.trim()||"…"));break;
    case "s2keep":{const r=SES.data.res;S.bank.push({de:r.b2||r.correct,topic:TOPICS.includes(r.topic)?r.topic:"Ich",d:ymd()});save();toast("Gespeichert in „Mein B2“.");el.disabled=true;break}
    case "upShow":$("upModel").hidden=false;break;
    case "s5new":SES.data.prompt=PROMPTS[Math.floor(Math.random()*PROMPTS.length)];render();break;
    case "s5check":s5check();break;
    case "s5copy":noAI(s5Prompt($("s5in").value.trim()||"…"));break;
    case "s5keep":{const r=SES.data.res;let n=0;document.querySelectorAll("[data-keep]").forEach(c=>{if(c.checked){S.bank.push({de:r.keep[Number(c.dataset.keep)],topic:SES.data.prompt[0],d:ymd()});n++}});save();toast(n+" Sätze in „Mein B2“ gespeichert.");el.disabled=true;break}
    case "s5echo":SES.step="echo";SES.data.echo="";render();break;
    case "s5peek":toast(SES.data.res.b2.split(/[.!?]/)[0]+" …");break;
    case "s5echoCheck":s5echoCheck();break;
    case "chatSend":{const v=$("chatIn").value.trim();if(v)chatSend(v);break}
    case "chatFb":chatSend("FEEDBACK");break;
    case "chatSay":{const m=(SES.data.msgs||[]).filter(x=>x.role==="assistant").pop();if(m)speak(m.content.replace(/[|*#]/g," "));break}
    case "chatCopy":copyText(charRules(SES.data.char)+"\n\n---\n\nStart the conversation now with a natural opening line.");break;
    case "s30check":s30check();break;
    case "s30copy":noAI(s30Prompt($("s30in").value.trim()||"…"));break;
    case "mDone":missionNote=true;render();break;
    case "mCancel":missionNote=false;render();break;
    case "mSave":{const n=$("mNote").value.trim();const t=today();t.mission=true;S.wins.push({m:mission()[1],t:n||"Geschafft.",d:ymd()});addMinutes(5,"mission");missionNote=false;toast("Auf der Beweis-Wand. Darauf kannst du stolz sein.");render();break}
    case "mOther":today().mOff++;save();render();break;
    case "readAll":{let i=0;const list=S.bank.map(b=>b.de);const next=()=>{if(i<list.length){const s=list[i++];speak(s,.9,()=>setTimeout(next,1800))}};next();toast("Sprich in der Pause nach jedem Satz nach.");break}
    case "copyBank":copyText(S.bank.map(b=>b.de).join("\n"));break;
    case "planSave":{S.why=$("why").value.trim()||S.why;S.goal=Math.max(5,Math.min(240,Number($("goal").value)||30));document.querySelectorAll("[data-anc]").forEach(i=>{const a=S.anchors[Number(i.dataset.anc)];a[i.dataset.f]=i.dataset.f==="min"?Math.max(1,Number(i.value)||5):i.value.trim()});S.setup=true;save();toast("Plan gespeichert.");location.hash="heute";break}
    case "export":copyText(JSON.stringify(S));break;
    case "resetAsk":$("resetC").hidden=false;break;
    case "resetNo":$("resetC").hidden=true;break;
    case "resetYes":S=defaults();save();render();toast("Zurückgesetzt.");break;
  }
});
document.addEventListener("change",e=>{const i=e.target.dataset.anch;if(i!==undefined){const d=today(),n=Number(i),a=S.anchors[n];if(e.target.checked&&!d.anch.includes(n)){d.anch.push(n);addMinutes(a.min,"anchor");toast(celebrate(a.min))}else if(!e.target.checked&&d.anch.includes(n)){d.anch=d.anch.filter(x=>x!==n);d.min=Math.max(0,d.min-a.min);save()}render()}});
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="s5in"){SES.data.text=e.target.value;$("s5wc").textContent=wc(e.target.value)+" Wörter"}
  if(id==="s30in"){SES.data.text=e.target.value;$("s30wc").textContent=wc(e.target.value)+" Wörter"}
  if(id==="s2in")SES.data.text=e.target.value;
  if(id==="s5echoIn")SES.data.echo=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="s2in"){e.preventDefault();s2check()}if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&e.target.id==="chatIn"){e.preventDefault();const v=e.target.value.trim();if(v)chatSend(v)}});

/* ================= BOOT ================= */
route();setSync("In diesem Browser gespeichert");
(async function cloud(){const c=window.claude;if(!c||!c.use)return;
  c.use("sample").then(s=>{if(s){sampleFn=s;if(!SES)render()}}).catch(()=>{});
  try{const[db,user]=await Promise.all([c.use("db"),c.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;
    const ref=db.doc("data/users/"+id+"/state");const to=setTimeout(()=>setSync("Konto antwortet nicht – im Browser gespeichert"),10000);
    const snap=await ref.get();clearTimeout(to);dbRef=ref;
    if(snap.exists){const r=snap.data();if((r.updatedAt||0)>(S.updatedAt||0)){S=normalize(r);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!SES)render()}else save()}else save();
    setSync("Gespeichert in deinem Claude-Konto – auf jedem Gerät gleich.")}catch(e){}})();
